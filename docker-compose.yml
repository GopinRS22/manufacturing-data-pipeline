name: factory-capstone
services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  spark:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.spark
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_ROOT: /data
      PYTHONPATH: /app/src
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./data:/data
      - spark-ivy:/home/spark/.ivy2
    command: ["sleep", "infinity"]

  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    working_dir: /app
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_ROOT: /data
      PYTHONPATH: /app/src
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./data:/data
      - airflow-state:/opt/airflow
      - airflow-ivy:/home/airflow/.ivy2
    command: ["airflow", "standalone"]

volumes:
  kafka-data:
  spark-ivy:
  airflow-ivy:
  airflow-state:
